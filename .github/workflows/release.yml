name: Release

# Push a tag like v0.7.0 (it must match "## Version" in summoncore.toc) to build and publish a zip.
# Or run this workflow by hand (Actions > Release > Run workflow) on master: it tags the commit with the TOC version itself.
# Once the GitHub release exists, a second job uploads the same tag to CurseForge (project id in the TOC, key in the
# CF_API_KEY secret). It is a separate job so a failed upload can be retried with "Re-run failed jobs".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the tag
        id: tag
        run: |
          toc=$(grep -m1 '^## Version:' summoncore.toc | sed 's/^## Version: *//' | tr -d '\r')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$toc" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match TOC version v$toc"
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "master" ]; then
            echo "Run it on master: a release is cut from master"
            exit 1
          elif git ls-remote --exit-code --tags origin "refs/tags/v$toc" >/dev/null; then
            echo "v$toc is already tagged: bump the version in summoncore.toc first"
            exit 1
          fi
          echo "TAG=v$toc" >> "$GITHUB_ENV"
          echo "tag=v$toc" >> "$GITHUB_OUTPUT"
      - name: Package
        run: |
          mkdir -p dist/summoncore
          cp ./*.lua summoncore.toc Bindings.xml README.md dist/summoncore/
          cp -r Media dist/summoncore/Media
          rm -f dist/summoncore/Media/.gitkeep
          (cd dist && zip -r "summoncore-${TAG}.zip" summoncore)
      - name: Describe it for addon managers
        # release.json is the BigWigs packager's metadata, which WowUp (and others) read to pick the zip for an install:
        # without it WowUp offers a plain zip only to retail, and a Classic Beta install finds nothing. The addon is
        # one zip for every flavour, so it is listed under each, with the TOC's interface number.
        run: |
          iface=$(grep -m1 '^## Interface:' summoncore.toc | sed 's/^## Interface: *//' | tr -d '\r')
          meta=""
          for flavor in mainline classic bcc wrath cata mists; do
            meta="${meta}${meta:+,}{\"flavor\":\"$flavor\",\"interface\":$iface}"
          done
          printf '{"releases":[{"name":"Summon Core","version":"%s","filename":"summoncore-%s.zip","nolib":false,"metadata":[%s]}]}\n' \
            "$TAG" "$TAG" "$meta" > dist/release.json
          cat dist/release.json
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --target creates the tag on this commit when it does not exist yet (a hand-run release)
        run: gh release create "$TAG" "dist/summoncore-${TAG}.zip" dist/release.json --title "$TAG" --target "$GITHUB_SHA" --generate-notes

  curseforge:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
      # The packager builds its own zip from .pkgmeta and sends it to CurseForge. GITHUB_OAUTH is left unset on purpose:
      # with it the packager would make a second GitHub release, and the one above already carries release.json.
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
