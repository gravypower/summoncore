<style>
/* Layout: a single storybook stage with narration captions, a scrubber and eight scene tabs underneath. */
:root {
  --ground: #17141F;
  --panel: #231E30;
  --paper: #F1E6CF;
  --ink: #23202B;
  --text: #EDE6D6;
  --muted: #A79FB5;
  --rust: #E0674D;
  --violet: #9B7BE0;
  --brass: #C99A3B;
  --display: "Patua One", Georgia, serif;
  --body: "Special Elite", "Courier New", monospace;
  color-scheme: dark;
}
html, body { margin: 0; }
body {
  background: var(--ground);
  color: var(--text);
  font-family: var(--body);
  padding-inline: 16px;
  padding-block: 24px 40px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; flex-direction: column; gap: 4px; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 48px); text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 15px; }
.stage { position: relative; border: 3px solid var(--paper); border-radius: 10px; overflow: hidden; background: var(--paper); aspect-ratio: 16 / 9; max-width: 100%; }
.stage svg#stage { display: block; width: 100%; height: 100%; }
.bigplay {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  font-family: var(--display); font-size: clamp(20px, 3.4vw, 30px);
  background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 999px;
  padding: 14px 30px; cursor: pointer; box-shadow: 0 6px 0 var(--ink);
}
.bigplay:hover { transform: translate(-50%, calc(-50% + 2px)); box-shadow: 0 4px 0 var(--ink); }
.caption { margin: 0; min-height: 5.6em; font-size: clamp(16px, 2.2vw, 20px); line-height: 1.5; max-width: 62ch; text-wrap: pretty; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
button.ctl {
  font-family: var(--body); font-size: 15px; color: var(--text); background: var(--panel);
  border: 2px solid var(--muted); border-radius: 8px; padding: 10px 16px; min-height: 44px; cursor: pointer;
}
button.ctl:hover { border-color: var(--text); }
button.ctl[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
.scrub { flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 12px; }
.scrub input[type=range] { flex: 1; min-width: 0; accent-color: var(--brass); height: 44px; }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; white-space: nowrap; }
.scenes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .scenes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.scenes button {
  font-family: var(--body); font-size: 14px; text-align: left; color: var(--text); background: var(--panel);
  border: 2px solid transparent; border-radius: 8px; padding: 10px 12px; min-height: 44px; cursor: pointer;
  display: flex; flex-direction: column; gap: 2px;
}
.scenes button span.n { font-family: var(--display); color: var(--muted); font-size: 13px; letter-spacing: 0.06em; }
.scenes button:hover { border-color: var(--muted); }
.scenes button[aria-current="true"] { border-color: var(--brass); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
.note { margin: 0; color: var(--muted); font-size: 13px; max-width: 70ch; }
</style>

  });
  // scene 58
  scenes.push({
    label: "Unmasked", dur: 23.6,
    text: "It was Poogs. He had missed every session as a witness because he had been at every session as the Auditor. When the last season ended, he explained, he had not been ready to stop summoning Zennit. So he had rung the bell himself. The party said they had suspected since the notebook. They had not. Zennit said he had. He had.",

      out += g5Book(118, 436, -3, 'EXHIBIT A');
      out += g5Card(318, 442, 'APOLOGIES', -3) + inkMark(392, 430, 126, 'PRESENT', -12, 21);
      // what is left of the Auditor: the spectacles, the nameplate, the stamp
      out += g5Specs(526, 442, -6) + g5Card(600, 440, 'AUDITOR', -2) + stampProp(672, 456, 0.72, 4);
      // the hat, held in both hands in front of him
      out += g5Solid(g5Hand(272, 400, 12) + g5Hand(418, 394, 12) + hat(345, 396, 0.72, -6));
      out += g5Spark(283, 197, [1, 0.6, 0.9][k]) + g5Drop(436, 252 + k * 3, 0.9);
      // "I knew it": three times, with sweat
      out += g5Say(6, 30, 156, 46, 46, 166, ['I knew it!'], 22, 'Special Elite, monospace') + g5Say(96, 86, 156, 46, 128, 194, ['I knew it!'], 22, 'Special Elite, monospace') + g5Say(196, 126, 156, 46, 212, 204, ['I knew it!'], 22, 'Special Elite, monospace');
      out += g5Drop(86, 236 + k * 3, 1) + g5Drop(166, 240 - k * 3, 1) + g5Drop(246, 238 + k * 2, 1);
      // Zennit had
      out += g5Say(648, 112, 120, 46, 786, 212, ['I had.'], 24, 'Special Elite, monospace');

  });
  // scene 59
  scenes.push({
    label: "Form 27B slash 7", dur: 25.9,
    text: "Poogs wrote the finding himself, and stamped it, in triplicate: Zennit had been summoned persistently, unreasonably, and out of affection, which is not an offence. He filed himself under it first. Then Zennit was handed a new form, a Request to Be Summoned. He filled it in at once and gave it to Poogs. It was, by general agreement, a slightly larger cake.",
    frame: function (k) {
      var out = g5Room() + g5Bunting(k);
      out += hero(50, 250, '#5B3FA0', 'wizard', k !== 1) + hero(130, 250, '#7A3A22', 'spiky', k === 1) + hero(210, 250, '#2D4339', 'hood', k !== 2);
      out += g5Fig('poogs', 250, 165, 0.65, [0, 1, -1][k], '');
      out += g5Fig('zenit', 690, 175, 0.55, [-1, 1, 0][k]);
      out += g5Table();
      // Poogs writes the finding himself and stamps it, in triplicate
      out += g5Solid(paper(404, 416, 100, 48, 4, '') + paper(396, 412, 100, 48, -3, '') + paper(388, 408, 100, 48, 2, 'FINDING'));
      var up = [16, 0, 8][k];
      out += g5Solid(stampProp(450, 452 - up, 0.75, 0) + g5Hand(446, 384 - up, 14));
      if (k === 1) out += '<path d="M386 440 l-14 -8 M388 456 l-16 2 M512 440 l14 -8 M510 456 l16 2" fill="none" stroke="#FFE98A" stroke-width="5" stroke-linecap="round"/>';
      out += '<g transform="rotate(-1.5 434 118)"><g class="feature"><rect x="278" y="68" width="344" height="116" fill="#F7F0DF" stroke="#23202B" stroke-width="3"/><rect x="270" y="62" width="344" height="116" fill="#F7F0DF" stroke="#23202B" stroke-width="3"/><rect x="262" y="56" width="344" height="116" fill="#F7F0DF" stroke="#23202B" stroke-width="4"/></g>' +
        T(280, 90, 'FINDING:', 26, '#23202B', 'start') + T(280, 116, 'SUMMONED PERSISTENTLY,', 15, '#23202B', 'start', 'Special Elite, monospace') + T(280, 138, 'UNREASONABLY, AND', 16, '#23202B', 'start', 'Special Elite, monospace') + T(280, 160, 'OUT OF AFFECTION.', 16, '#23202B', 'start', 'Special Elite, monospace') +
        '<g transform="rotate(-9 556 132)" opacity="0.92"><rect x="498" y="100" width="116" height="64" rx="5" fill="none" stroke="#B5432E" stroke-width="5"/>' + T(556, 128 + [0, -2, 2][k], 'NOT AN', 22, '#B5432E') + T(556, 154 + [0, -2, 2][k], 'OFFENCE', 22, '#B5432E') + '</g></g>';
      // he files himself under it first
      out += '<rect x="196" y="418" width="96" height="40" fill="#8A5E3C" stroke="#23202B" stroke-width="4"/>' + T(244, 444, 'FINDING', 15, '#F7F0DF', 'middle', 'Special Elite, monospace') +
        '<g stroke="#23202B" stroke-width="2.5"><rect x="204" y="404" width="16" height="16" fill="#F7F0DF"/><rect x="224" y="404" width="16" height="16" fill="#F7F0DF"/><rect x="244" y="404" width="16" height="16" fill="#F7F0DF"/></g>';
      out += '<g transform="rotate(' + [-6, -2, -8][k] + ' 322 410)">' + g5Solid('<rect x="300" y="386" width="46" height="60" fill="#F7F0DF" stroke="#23202B" stroke-width="3.5"/>') + T(323, 428, 'P', 40, '#B5432E') + '</g>' + g5Solid(g5Hand(334, 424, 13));
      // the new form, handed over, filled in at once
      out += '<g transform="rotate(' + [1.5, 0.5, 2.5][k] + ' 798 132)"><rect x="652" y="68" width="292" height="132" fill="#F7F0DF" stroke="#23202B" stroke-width="4"/>' +
        T(670, 102, 'FORM 27B/7', 28, '#23202B', 'start') + T(670, 124, 'REQUEST TO BE SUMMONED', 14, '#23202B', 'start', 'Special Elite, monospace') +

      out += '<g transform="translate(790 182) rotate(' + [-30, -36, -26][k] + ')"><path d="M0 0 L16 -5 L16 5 Z" fill="#C99A3B" stroke="#23202B" stroke-width="2.5" stroke-linejoin="round"/><rect x="16" y="-5" width="52" height="10" rx="5" fill="#23202B"/></g>';

  // @@S2 end 2g5

  var starts = [], acc = 0;
  scenes.forEach(function (s, i) { s.start = acc; starts[i] = acc; acc += s.dur; });
  TOTAL = acc;

  var stage = document.getElementById('stage');
  var aud = document.getElementById('aud');
  var capEl = document.getElementById('caption');
  var playBtn = document.getElementById('playBtn');
  var bigPlay = document.getElementById('bigPlay');
  var restartBtn = document.getElementById('restartBtn');
  var muteBtn = document.getElementById('muteBtn');
  var seek = document.getElementById('seek');
  var timeEl = document.getElementById('time');
  var nav = document.getElementById('scenes');

  seek.max = TOTAL.toFixed(1);

  scenes.forEach(function (s, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '<span class="n">SCENE ' + (i + 1) + '</span><span>' + s.label + '</span>';
    b.addEventListener('click', function () { seekTo(starts[i] + 0.05); play(); });
    nav.appendChild(b);
  });
  var navBtns = nav.querySelectorAll('button');

  var playing = false, usingAudio = true, clock = 0, lastTs = 0, curScene = -1, curFrame = -1, curTick = -1;

  function fmt(t) { var m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + (s < 10 ? '0' : '') + s; }
  function now() { return usingAudio ? aud.currentTime : clock; }

  function sceneAt(t) {
    for (var i = scenes.length - 1; i >= 0; i--) if (t >= starts[i]) return i;
    return 0;
  }

  function render(si, fi, tick) {
    var f = scenes[si].frame(fi);
    var filt = reduce ? '' : ' filter="url(#' + (tick % 2 ? 'wB' : 'wA') + ')"';
    stage.innerHTML = '<g' + filt + '>' + f + '</g>';
  }

  function update(t) {
    var si = sceneAt(t);
    var tick = Math.floor(t * FPS);
    var fi = tick % 3;
    if (si !== curScene || fi !== curFrame || tick !== curTick) {
      render(si, fi, tick);
      curFrame = fi; curTick = tick;
    }
    if (si !== curScene) {
      curScene = si;
      capEl.textContent = scenes[si].text;
      for (var i = 0; i < navBtns.length; i++) navBtns[i].setAttribute('aria-current', i === si ? 'true' : 'false');
    }
    if (document.activeElement !== seek) seek.value = t.toFixed(1);
    timeEl.textContent = fmt(t) + ' / ' + fmt(TOTAL);
  }

  function setPlaying(p) {
    playing = p;
    playBtn.textContent = p ? 'Pause' : 'Play';
    bigPlay.hidden = p || now() > 0.2;
  }

  function play() {
    if (now() >= TOTAL - 0.2) seekTo(0);
    if (usingAudio) {
      var pr = aud.play();
      if (pr && pr.catch) pr.catch(function () { usingAudio = false; clock = aud.currentTime || clock; setPlaying(true); });
    }
    setPlaying(true);
  }
  function pause() {
    if (usingAudio) aud.pause();
    setPlaying(false);
  }
  function seekTo(t) {
    t = Math.max(0, Math.min(TOTAL, t));
    if (usingAudio) { try { aud.currentTime = t; } catch (e) { usingAudio = false; } }
    clock = t;
    curScene = -1;
    update(t);
  }

  aud.addEventListener('error', function () { usingAudio = false; });
  aud.addEventListener('ended', function () { setPlaying(false); bigPlay.hidden = false; bigPlay.textContent = 'Play again'; });
  playBtn.addEventListener('click', function () { playing ? pause() : play(); });
  bigPlay.addEventListener('click', function () { play(); });
  restartBtn.addEventListener('click', function () { seekTo(0); play(); });
  muteBtn.addEventListener('click', function () {
    aud.muted = !aud.muted;
    muteBtn.setAttribute('aria-pressed', String(aud.muted));
    muteBtn.textContent = aud.muted ? 'Sound off' : 'Sound on';
  });
  seek.addEventListener('input', function () { seekTo(parseFloat(seek.value)); });

  function loop(ts) {
    if (!usingAudio && playing) {
      clock += (ts - lastTs) / 1000;
      if (clock >= TOTAL) { clock = TOTAL; setPlaying(false); bigPlay.hidden = false; bigPlay.textContent = 'Play again'; }
    }
    lastTs = ts;
    update(now());
    requestAnimationFrame(loop);
  }

  update(0);
  requestAnimationFrame(loop);
})();
</script>
