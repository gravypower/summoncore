<style>
/* Layout: a single storybook stage with narration captions, a scrubber and eight scene tabs underneath. */
:root {
  --ground: #17141F;
  --panel: #231E30;
  --paper: #F1E6CF;
  --ink: #23202B;
  --text: #EDE6D6;
  --muted: #A79FB5;
  --rust: #E0674D;
  --violet: #9B7BE0;
  --brass: #C99A3B;
  --display: "Patua One", Georgia, serif;
  --body: "Special Elite", "Courier New", monospace;
  color-scheme: dark;
}
html, body { margin: 0; }
body {
  background: var(--ground);
  color: var(--text);
  font-family: var(--body);
  padding-inline: 16px;
  padding-block: 24px 40px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; flex-direction: column; gap: 4px; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 48px); text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 15px; }
.stage { position: relative; border: 3px solid var(--paper); border-radius: 10px; overflow: hidden; background: var(--paper); aspect-ratio: 16 / 9; max-width: 100%; }
.stage svg#stage { display: block; width: 100%; height: 100%; }
.bigplay {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  font-family: var(--display); font-size: clamp(20px, 3.4vw, 30px);
  background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 999px;
  padding: 14px 30px; cursor: pointer; box-shadow: 0 6px 0 var(--ink);
}
.bigplay:hover { transform: translate(-50%, calc(-50% + 2px)); box-shadow: 0 4px 0 var(--ink); }
.caption { margin: 0; min-height: 5.6em; font-size: clamp(16px, 2.2vw, 20px); line-height: 1.5; max-width: 62ch; text-wrap: pretty; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
button.ctl {
  font-family: var(--body); font-size: 15px; color: var(--text); background: var(--panel);
  border: 2px solid var(--muted); border-radius: 8px; padding: 10px 16px; min-height: 44px; cursor: pointer;
}
button.ctl:hover { border-color: var(--text); }
button.ctl[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
.scrub { flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 12px; }
.scrub input[type=range] { flex: 1; min-width: 0; accent-color: var(--brass); height: 44px; }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; white-space: nowrap; }
.scenes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .scenes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.scenes button {
  font-family: var(--body); font-size: 14px; text-align: left; color: var(--text); background: var(--panel);
  border: 2px solid transparent; border-radius: 8px; padding: 10px 12px; min-height: 44px; cursor: pointer;
  display: flex; flex-direction: column; gap: 2px;
}
.scenes button span.n { font-family: var(--display); color: var(--muted); font-size: 13px; letter-spacing: 0.06em; }
.scenes button:hover { border-color: var(--muted); }
.scenes button[aria-current="true"] { border-color: var(--brass); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
.note { margin: 0; color: var(--muted); font-size: 13px; max-width: 70ch; }
</style>

      });
      out += T(260, 470, 'points for the place you summon him to', 17, '#EDE6D6', 'middle', 'Special Elite, monospace');
      // Zennit's secret list: every line hidden
      out += '<g transform="rotate(' + [-3, -1, -4][k] + ' 615 250)"><rect x="510" y="60" width="210" height="380" fill="#F7F0DF" stroke="#23202B" stroke-width="4"/>' +
        T(615, 100, 'SECRET LIST', 24, '#23202B');
      for (var r = 0; r < 5; r++) {
        out += '<rect x="528" y="' + (130 + r * 58) + '" width="22" height="22" fill="none" stroke="#23202B" stroke-width="3"/>' +
          '<rect x="562" y="' + (132 + r * 58) + '" width="140" height="18" fill="#23202B"/>';
      }
      if (k === 2) out += '<path d="M531 143 l7 8 l12 -16" stroke="#3E5B4E" stroke-width="5" fill="none"/>';
      out += '</g>';
      out += zen(748, 190, 0.5, [-2, 2, 0][k]);
      return out;
    }
  });

  scenes.push({
    label: 'The options', dur: 26.1,
    text: 'If Zennit completes his list first, he wins the week, and cannot be summoned for the seven days that follow. He may refuse a summons. He may demand fifty silver, in cash, with no receipt. Or he may suggest dice. The Index will accept any of these. The Index accepts most things.',
    frame: function (k) {
      var out = '<rect width="960" height="540" fill="url(#gViolet)"/>';
      out += zen(40, 100, 0.66, [-2, 2, 0][k]);
      // his three options
      [['REFUSE', 330], ['50 SILVER', 520], ['DICE', 710]].forEach(function (c) {
        out += '<rect x="' + c[1] + '" y="90" width="180" height="250" fill="#F7F0DF" stroke="#23202B" stroke-width="4"/>' +
          T(c[1] + 90, 128, c[0], 22, '#23202B');
      });
      out += '<circle cx="420" cy="230" r="58" fill="none" stroke="#B5432E" stroke-width="10"/>' +
        '<path d="M380 190 L460 270 M460 190 L380 270" stroke="#B5432E" stroke-width="10" stroke-linecap="round" fill="none"/>';
      var bob = [0, -10, -4][k];
      out += '<g transform="translate(0 ' + bob + ')"><circle cx="610" cy="230" r="58" fill="#D9D9E3" stroke="#23202B" stroke-width="5"/>' +
        '<circle cx="610" cy="230" r="44" fill="none" stroke="#23202B" stroke-width="3"/>' + T(610, 248, '50', 48, '#23202B') + '</g>';
      var faces = [[1, 4], [3, 6], [5, 2]][k];
      out += die(734, 195, faces[0]) + die(792, 240, faces[1]);
      // the Index accepts
      out += U('book', 330, 365, 90, 123);
      out += '<g><rect x="440" y="376" width="300" height="82" rx="12" fill="#FFFFFF" stroke="#23202B" stroke-width="3"/>' +
        '<path d="M440 420 L420 440 L452 432 Z" fill="#FFFFFF" stroke="#23202B" stroke-width="3"/>' +
        T(590, 410, 'The Index accepts', 19, '#23202B', 'middle', 'Special Elite, monospace') +
        T(590, 436, 'most things.', 19, '#23202B', 'middle', 'Special Elite, monospace') + '</g>';
      return out;
    }
  });

  var starts = [], acc = 0;
  scenes.forEach(function (s, i) { s.start = acc; starts[i] = acc; acc += s.dur; });
  TOTAL = acc;

  var stage = document.getElementById('stage');
  var aud = document.getElementById('aud');
  var capEl = document.getElementById('caption');
  var playBtn = document.getElementById('playBtn');
  var bigPlay = document.getElementById('bigPlay');
  var restartBtn = document.getElementById('restartBtn');
  var muteBtn = document.getElementById('muteBtn');
  var seek = document.getElementById('seek');
  var timeEl = document.getElementById('time');
  var nav = document.getElementById('scenes');

  seek.max = TOTAL.toFixed(1);

  scenes.forEach(function (s, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '<span class="n">SCENE ' + (i + 1) + '</span><span>' + s.label + '</span>';
    b.addEventListener('click', function () { seekTo(starts[i] + 0.05); play(); });
    nav.appendChild(b);
  });
  var navBtns = nav.querySelectorAll('button');

  var playing = false, usingAudio = true, clock = 0, lastTs = 0, curScene = -1, curFrame = -1, curTick = -1;

  function fmt(t) { var m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + (s < 10 ? '0' : '') + s; }
  function now() { return usingAudio ? aud.currentTime : clock; }

  function sceneAt(t) {
    for (var i = scenes.length - 1; i >= 0; i--) if (t >= starts[i]) return i;
    return 0;
  }

  function render(si, fi, tick) {
    var f = scenes[si].frame(fi);
    var filt = reduce ? '' : ' filter="url(#' + (tick % 2 ? 'wB' : 'wA') + ')"';
    stage.innerHTML = '<g' + filt + '>' + f + '</g>';
  }

  function update(t) {
    var si = sceneAt(t);
    var tick = Math.floor(t * FPS);
    var fi = tick % 3;
    if (si !== curScene || fi !== curFrame || tick !== curTick) {
      render(si, fi, tick);
      curFrame = fi; curTick = tick;
    }
    if (si !== curScene) {
      curScene = si;
      capEl.textContent = scenes[si].text;
      for (var i = 0; i < navBtns.length; i++) navBtns[i].setAttribute('aria-current', i === si ? 'true' : 'false');
    }
    if (document.activeElement !== seek) seek.value = t.toFixed(1);
    timeEl.textContent = fmt(t) + ' / ' + fmt(TOTAL);
  }

  function setPlaying(p) {
    playing = p;
    playBtn.textContent = p ? 'Pause' : 'Play';
    bigPlay.hidden = p || now() > 0.2;
  }

  function play() {
    if (now() >= TOTAL - 0.2) seekTo(0);
    if (usingAudio) {
      var pr = aud.play();
      if (pr && pr.catch) pr.catch(function () { usingAudio = false; clock = aud.currentTime || clock; setPlaying(true); });
    }
    setPlaying(true);
  }
  function pause() {
    if (usingAudio) aud.pause();
    setPlaying(false);
  }
  function seekTo(t) {
    t = Math.max(0, Math.min(TOTAL, t));
    if (usingAudio) { try { aud.currentTime = t; } catch (e) { usingAudio = false; } }
    clock = t;
    curScene = -1;
    update(t);
  }

  aud.addEventListener('error', function () { usingAudio = false; });
  aud.addEventListener('ended', function () { setPlaying(false); bigPlay.hidden = false; bigPlay.textContent = 'Play again'; });
  playBtn.addEventListener('click', function () { playing ? pause() : play(); });
  bigPlay.addEventListener('click', function () { play(); });
  restartBtn.addEventListener('click', function () { seekTo(0); play(); });
  muteBtn.addEventListener('click', function () {
    aud.muted = !aud.muted;
    muteBtn.setAttribute('aria-pressed', String(aud.muted));
    muteBtn.textContent = aud.muted ? 'Sound off' : 'Sound on';
  });
  seek.addEventListener('input', function () { seekTo(parseFloat(seek.value)); });

  function loop(ts) {
    if (!usingAudio && playing) {
      clock += (ts - lastTs) / 1000;
      if (clock >= TOTAL) { clock = TOTAL; setPlaying(false); bigPlay.hidden = false; bigPlay.textContent = 'Play again'; }
    }
    lastTs = ts;
    update(now());
    requestAnimationFrame(loop);
  }

  update(0);
  requestAnimationFrame(loop);
})();
</script>

</body></html>
